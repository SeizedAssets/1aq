<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Download main.bat</title>
  <script>
    window.onload = function() {
      const a = document.createElement('a');
      a.href = 'main.bat';
      a.download = 'main.bat';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    };
  </script>
</head>
<body>
  <p>If your download doesn’t start automatically, <a href="main.bat" download>click here</a>.</p>
</body>
</html>
